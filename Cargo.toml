[package]
name = "gitplay"
version = "0.1.0"
edition = "2021"
description = "Live rolling git diff visualizer"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
similar = { version = "3.2", features = ["inline"] }
notify = "8.0"
notify-debouncer-mini = "0.7"
ignore = "0.4"
crossterm = "0.28"
